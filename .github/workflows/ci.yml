name: CI

on:
    push:
    pull_request:

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v3

            - name: Set up Python
              run: uv python install 3.12

            - name: Sync dependencies (CPU torch)
              env:
                  UV_TORCH_BACKEND: cpu
              run: uv sync --extra dev

            - name: Ruff lint
              run: uv run ruff check .

            - name: Ruff format
              run: uv run ruff format --check .

            - name: Tests
              run: uv run pytest

    metrics-gate:
        runs-on: ubuntu-latest
        needs: lint-and-test
        if: ${{ github.ref == 'refs/heads/main' }}
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v3
            - run: uv python install 3.12
            - name: Run the metrics gate on Modal (fails the build on AUROC regression)
              env:
                  MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
                  MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
              run: |
                  if [ -z "$MODAL_TOKEN_ID" ]; then
                    echo "No Modal credentials configured. Skipping the model metrics gate."
                    exit 0
                  fi
                  uv run modal run modal_app.py::metrics_gate --category bottle
